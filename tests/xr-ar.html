<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>AR page test</title>
  <link rel="icon" href="data:," />
  <style>body { margin: 0; display: flex; gap: 16px; background: #111; color: #ddd; font: 13px monospace; } iframe { border: 0; flex: none; } pre { padding: 12px; }</style>
</head>
<body>
  <!--
    End to end: the real AR page (xr/ar.html, card mode) runs in this frame while Chromium's
    fake camera plays the synthetic card video. Checks that the 3D model appears on the card,
    sits where the card is on screen (camera fitting + object-fit: cover cropping), and goes
    away when the card leaves the picture.
  -->
  <iframe id="app" src="../xr/ar.html?start=card&test" width="960" height="600" allow="camera; autoplay; xr-spatial-tracking"></iframe>
  <pre id="log">starting…</pre>
  <script type="module">
    const frame = document.getElementById('app');
    const log = document.getElementById('log');
    const truth = await (await fetch('fixtures/xr/card_motion.json')).json();
    const wait = (ms) => new Promise((r) => setTimeout(r, ms));
    const results = [];
    const check = (name, pass, error) => results.push({ group: 'AR page', name, pass: !!pass, error });
    const errors = [];

    let ar = null;
    const start = performance.now();
    while (performance.now() - start < 60000) {
      ar = frame.contentWindow?.__ar;
      if (ar?.tracker) break;
      await wait(100);
    }
    frame.contentWindow.addEventListener('error', (e) => errors.push(e.message));
    frame.contentWindow.addEventListener('unhandledrejection', (e) => errors.push(String(e.reason)));
    check('card mode starts: camera + tracker running', ar?.tracker, 'no tracker after 60 s');

    const samples = [];
    if (ar?.tracker) {
      const THREE_V = ar.camera.position.constructor;
      const end = performance.now() + 13000;
      while (performance.now() < end) {
        const t = ar.video.currentTime;
        let screen = null;
        if (ar.anchor.visible) {
          const v = new THREE_V().setFromMatrixPosition(ar.anchor.matrixWorld).project(ar.camera);
          screen = [((v.x + 1) / 2) * frame.clientWidth, ((1 - v.y) / 2) * frame.clientHeight];
        }
        samples.push({ t, visible: ar.anchor.visible, screen });
        await wait(50);
      }
    }

    // Where the card centre really is on screen: video pixels → object-fit: cover.
    const vw = ar?.video.videoWidth || 640;
    const vh = ar?.video.videoHeight || 480;
    const cover = Math.max(frame.clientWidth / vw, frame.clientHeight / vh);
    const ox = (vw * cover - frame.clientWidth) / 2;
    const oy = (vh * cover - frame.clientHeight) / 2;
    const frameAt = (t) => Math.floor(t * truth.fps) % truth.corners.length;
    let visibleN = 0, shownN = 0, emptyN = 0, phantomN = 0;
    const errorsPx = [];
    for (const s of samples) {
      const corners = truth.corners[frameAt(s.t)];
      if (!corners) { emptyN++; if (s.visible) phantomN++; continue; }
      if (s.t < 2.2) continue; // let the tracker lock on first
      visibleN++;
      if (!s.visible) continue;
      shownN++;
      const cx = corners.reduce((a, c) => a + c[0], 0) / 4 * cover - ox;
      const cy = corners.reduce((a, c) => a + c[1], 0) / 4 * cover - oy;
      errorsPx.push(Math.hypot(s.screen[0] - cx, s.screen[1] - cy));
    }
    errorsPx.sort((a, b) => a - b);
    const report = {
      samples: samples.length,
      shownWhileVisible: +(shownN / Math.max(visibleN, 1)).toFixed(3),
      phantom: +(phantomN / Math.max(emptyN, 1)).toFixed(3),
      medianScreenErrorPx: errorsPx.length ? +errorsPx[errorsPx.length >> 1].toFixed(1) : null,
      cover: +cover.toFixed(3),
    };
    log.textContent = JSON.stringify(report, null, 2);
    check('the model is shown on the card ≥ 70 % of the time', report.shownWhileVisible >= 0.7, JSON.stringify(report));
    check('no model when there is no card (≤ 10 %)', report.phantom <= 0.1, JSON.stringify(report));
    check('the model sits on the card on screen: median error ≤ 40 px', report.medianScreenErrorPx !== null && report.medianScreenErrorPx <= 40, JSON.stringify(report));
    const r = ar?.junction.reading;
    check('the model is live: physics reading present', r && r.W > 0, 'no reading');
    check('no runtime errors on the AR page', errors.length === 0, errors.join(' | '));

    // ?shot: also grab what the phone would show (camera + 3D), for a human to look at.
    if (new URLSearchParams(location.search).has('shot') && ar?.tracker) {
      const shots = [];
      for (const [slider, pose] of [[0.15, 'stand'], [0.6, 'face']]) {
        ar.setPose(pose);
        const input = frame.contentWindow.document.getElementById('a-slider');
        input.value = slider * 1000;
        input.dispatchEvent(new Event('input'));
        const until = performance.now() + 15000;
        await wait(1500);
        while (performance.now() < until && !(ar.anchor.visible && truth.corners[frameAt(ar.video.currentTime)])) await wait(30);
        const c = document.createElement('canvas');
        c.width = frame.clientWidth;
        c.height = frame.clientHeight;
        const g = c.getContext('2d');
        g.drawImage(ar.video, -ox, -oy, vw * cover, vh * cover);
        g.drawImage(ar.renderer.domElement, 0, 0, c.width, c.height);
        shots.push(c.toDataURL('image/jpeg', 0.85));
      }
      results[0].images = shots;
    }

    document.title = results.every((x) => x.pass) ? 'PASSED' : 'FAILED';
    if (new URLSearchParams(location.search).has('report')) {
      await fetch('/__results', { method: 'POST', body: JSON.stringify(results) });
    }
  </script>
</body>
</html>
