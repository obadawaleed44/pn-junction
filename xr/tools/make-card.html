<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Make the AR card</title>
  <link rel="icon" href="data:," />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@500&display=swap" />
  <style>
    body { margin: 0; padding: 24px; background: #222; color: #ddd; font: 14px system-ui, sans-serif; }
    canvas { width: 800px; height: auto; display: block; margin: 12px 0; box-shadow: 0 6px 20px #000; }
  </style>
</head>
<body>
  <!--
    The AR card artwork, drawn in code (so it is reproducible), then compiled into
    card.mind: the "fingerprint" of feature points the phone camera looks for.

    Run automatically:  python xr/tools/build_card.py
    Or open this page in a browser and use the buttons.
  -->
  <p id="status">Drawing…</p>
  <canvas id="card" width="1600" height="1000"></canvas>
  <button id="download-png" type="button">Download card.png</button>
  <button id="download-mind" type="button" disabled>Download card.mind</button>

  <script type="module">
    import { Compiler } from 'https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image.prod.js';

    const W = 1600;
    const H = 1000;
    const canvas = document.getElementById('card');
    const ctx = canvas.getContext('2d');
    const status = document.getElementById('status');

    // Deterministic randomness: the card is identical every time it is built.
    let seed = 20261031;
    const rand = () => {
      seed = (seed + 0x6d2b79f5) >>> 0;
      let t = seed;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };

    const INK = '#0c0f1d';
    const PAPER = '#f2ede2';
    const HOLE = '#ff3d7f';
    const ELECTRON = '#3d7bff';
    const GOLD = '#ffc24b';

    await document.fonts.load('700 120px "Space Grotesk"');
    await document.fonts.load('500 30px "JetBrains Mono"');
    draw();
    status.textContent = 'Compiling the tracking target…';

    function draw() {
      // Background with a subtle diagonal texture (gives the tracker detail everywhere).
      ctx.fillStyle = INK;
      ctx.fillRect(0, 0, W, H);
      ctx.strokeStyle = 'rgba(242, 237, 226, 0.05)';
      for (let i = -H; i < W; i += 22) {
        ctx.beginPath();
        ctx.moveTo(i, H);
        ctx.lineTo(i + H, 0);
        ctx.stroke();
      }

      // The "bar": p-region, depletion band, n-region.
      const bar = { x: 80, y: 330, w: 1440, h: 470 };
      const gapL = 690;
      const gapR = 900;
      ctx.fillStyle = 'rgba(255, 61, 127, 0.16)';
      ctx.fillRect(bar.x, bar.y, gapL - bar.x, bar.h);
      ctx.fillStyle = 'rgba(61, 123, 255, 0.16)';
      ctx.fillRect(gapR, bar.y, bar.x + bar.w - gapR, bar.h);
      ctx.strokeStyle = PAPER;
      ctx.lineWidth = 3;
      ctx.strokeRect(bar.x, bar.y, bar.w, bar.h);

      // Holes: hollow circles of random sizes (Poisson-disk-like scattering).
      scatter(bar.x + 18, gapL - 14, bar.y + 18, bar.y + bar.h - 18, 150, (x, y, r) => {
        ctx.strokeStyle = HOLE;
        ctx.lineWidth = 2 + r / 6;
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.stroke();
      });
      // Electrons: filled dots.
      scatter(gapR + 14, bar.x + bar.w - 18, bar.y + 18, bar.y + bar.h - 18, 170, (x, y, r) => {
        ctx.fillStyle = ELECTRON;
        ctx.beginPath();
        ctx.arc(x, y, r * 0.8, 0, Math.PI * 2);
        ctx.fill();
      });
      // Exposed ions in the depletion band: ⊖ left of the junction, ⊕ right.
      const cols = [710, 750, 790, 830, 870];
      cols.forEach((cx, c) => {
        for (let k = 0; k < 9; k++) {
          const cy = bar.y + 34 + k * 50 + (c % 2) * 14;
          const positive = cx > 795;
          ctx.strokeStyle = GOLD;
          ctx.lineWidth = 3;
          ctx.strokeRect(cx - 13, cy - 13, 26, 26);
          ctx.beginPath();
          ctx.moveTo(cx - 7, cy);
          ctx.lineTo(cx + 7, cy);
          if (positive) {
            ctx.moveTo(cx, cy - 7);
            ctx.lineTo(cx, cy + 7);
          }
          ctx.stroke();
        }
      });
      // Field arrow (n → p) under the band.
      ctx.strokeStyle = GOLD;
      ctx.fillStyle = GOLD;
      ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.moveTo(gapR + 20, bar.y + bar.h + 50);
      ctx.lineTo(gapL - 4, bar.y + bar.h + 50);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(gapL - 22, bar.y + bar.h + 50);
      ctx.lineTo(gapL + 6, bar.y + bar.h + 36);
      ctx.lineTo(gapL + 6, bar.y + bar.h + 64);
      ctx.fill();
      ctx.font = 'italic 700 34px "Space Grotesk"';
      ctx.fillText('E', gapR + 34, bar.y + bar.h + 62);

      // Title block (asymmetric, top-left), and technical small print.
      ctx.fillStyle = PAPER;
      ctx.font = '700 132px "Space Grotesk"';
      ctx.fillText('PN', 80, 210);
      ctx.fillStyle = HOLE;
      ctx.fillRect(290, 112, 22, 98);
      ctx.fillStyle = PAPER;
      ctx.font = '700 58px "Space Grotesk"';
      ctx.fillText('JUNCTION', 336, 168);
      ctx.font = '500 26px "JetBrains Mono"';
      ctx.fillStyle = GOLD;
      ctx.fillText('REVERSE BIAS · AR CARD 01', 338, 208);
      ctx.fillStyle = 'rgba(242, 237, 226, 0.75)';
      ctx.font = '500 22px "JetBrains Mono"';
      ctx.fillText('p-type  N_A = 1e16', bar.x + 6, bar.y - 18);
      ctx.fillText('n-type  N_D = 1e16', bar.x + bar.w - 270, bar.y - 18);
      ctx.fillText('depletion', gapL + 18, bar.y - 18);

      // Big "−" and "+" terminals, deliberately different shapes.
      ctx.fillStyle = PAPER;
      ctx.beginPath();
      ctx.arc(1330, 150, 70, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = INK;
      ctx.fillRect(1290, 140, 80, 20);
      ctx.fillStyle = HOLE;
      ctx.fillRect(1445, 85, 130, 130);
      ctx.fillStyle = INK;
      ctx.fillRect(1495, 105, 30, 90);
      ctx.fillRect(1465, 135, 90, 30);

      // Scale bar and ticks.
      ctx.strokeStyle = PAPER;
      ctx.lineWidth = 2;
      for (let i = 0; i <= 24; i++) {
        const x = bar.x + (bar.w * i) / 24;
        ctx.beginPath();
        ctx.moveTo(x, bar.y + bar.h + 96);
        ctx.lineTo(x, bar.y + bar.h + (i % 4 === 0 ? 120 : 108));
        ctx.stroke();
      }
      ctx.fillStyle = 'rgba(242, 237, 226, 0.75)';
      ctx.fillText('x (µm)   −6  ·  −4  ·  −2  ·  0  ·  +2  ·  +4  ·  +6', bar.x, bar.y + bar.h + 152);

      // Corner marks: four different shapes so the card has no symmetry.
      ctx.fillStyle = GOLD;
      ctx.fillRect(20, 20, 60, 12);
      ctx.fillRect(20, 20, 12, 60);
      ctx.beginPath();
      ctx.arc(W - 46, H - 46, 26, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillRect(W - 80, 20, 60, 60);
      ctx.beginPath();
      ctx.moveTo(20, H - 20);
      ctx.lineTo(90, H - 20);
      ctx.lineTo(20, H - 90);
      ctx.fill();
    }

    /** Scatter non-overlapping circles in a box (rejection sampling). */
    function scatter(x0, x1, y0, y1, count, paint) {
      const placed = [];
      let tries = 0;
      while (placed.length < count && tries++ < count * 60) {
        const r = 6 + rand() * 14;
        const x = x0 + r + rand() * (x1 - x0 - 2 * r);
        const y = y0 + r + rand() * (y1 - y0 - 2 * r);
        if (placed.some((p) => Math.hypot(p.x - x, p.y - y) < p.r + r + 6)) continue;
        placed.push({ x, y, r });
        paint(x, y, r);
      }
    }

    // ------------------------------------------------------------ compile

    const pngUrl = canvas.toDataURL('image/png');
    const image = new Image();
    image.src = pngUrl;
    await image.decode();
    const compiler = new Compiler();
    await compiler.compileImageTargets([image], (progress) => {
      status.textContent = `Compiling the tracking target… ${progress.toFixed(0)} %`;
    });
    const mind = await compiler.exportData(); // Uint8Array
    status.textContent = `Done: card.png (${W}×${H}) and card.mind (${(mind.byteLength / 1024).toFixed(0)} kB).`;

    const download = (blob, name) => {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = name;
      a.click();
    };
    document.getElementById('download-png').onclick = () => canvas.toBlob((b) => download(b, 'card.png'));
    const mindButton = document.getElementById('download-mind');
    mindButton.disabled = false;
    mindButton.onclick = () => download(new Blob([mind]), 'card.mind');

    /** Bytes -> base64 in chunks (one giant String.fromCharCode(...) call overflows the stack). */
    function toBase64(bytes) {
      let text = '';
      for (let i = 0; i < bytes.length; i += 0x8000) text += String.fromCharCode(...bytes.subarray(i, i + 0x8000));
      return btoa(text);
    }

    // When run by build_card.py, send both files back to it.
    if (new URLSearchParams(location.search).has('report')) {
      await fetch('/__card', {
        method: 'POST',
        body: JSON.stringify({ png: pngUrl.split(',')[1], mind: toBase64(new Uint8Array(mind)) }),
      });
    }
  </script>
</body>
</html>
